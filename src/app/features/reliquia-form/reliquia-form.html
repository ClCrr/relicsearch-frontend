<h2 mat-dialog-title>{{ data?.id ? 'Editar Reliquia' : 'Nueva Reliquia' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form-container">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre de la reliquia</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej. Cáliz Sagrado">
      <mat-error *ngIf="form.get('nombre')?.hasError('required')">El nombre es obligatorio</mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="form.invalid">
    Guardar
  </button>
</mat-dialog-actions>
