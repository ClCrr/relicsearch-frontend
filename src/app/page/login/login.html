<div class="app-orokin-container">
  <div class="app-orokin-card">
    
    <!-- Encabezado Temático -->
    <h1 class="app-orokin-title">REGISTRO OROKIN</h1>
    <p class="app-orokin-subtitle">Ingresa tus credenciales para acceder al Vacío</p>

    <!-- 1. Conservamos tu formGroup y ngSubmit -->
    <form [formGroup]="loginForm" (ngSubmit)="ingresarSistema()">
      
      <!-- Campo Correo -->
      <div class="app-orokin-form-group">
        <!-- 2. Conservamos formControlName -->
        <input 
          class="app-orokin-input" 
          formControlName="email" 
          type="email" 
          placeholder="OPERADOR@CORREO.COM">
          
        <!-- Validaciones de Correo -->
        <div class="app-orokin-error" *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
          El correo es obligatorio
        </div>
        <div class="app-orokin-error" *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched">
          Ingresa un correo electrónico válido
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="app-orokin-form-group">
        <!-- 3. Conservamos formControlName -->
        <input 
          class="app-orokin-input" 
          formControlName="password" 
          type="password"
          placeholder="CONTRASEÑA">
          
        <!-- Validaciones de Contraseña -->
        <div class="app-orokin-error" *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
          La contraseña es obligatoria
        </div>
      </div>

      <!-- Mensaje de error si falla el backend -->
      <div class="app-orokin-error backend-error" *ngIf="errorMensaje">
        {{ errorMensaje }}
      </div>

      <!-- 4. Botón de acceso (Deshabilitado si el form es inválido) -->
      <button type="submit" class="app-orokin-btn" [disabled]="loginForm.invalid">
        INGRESAR
      </button>

    </form>
  </div>
</div>
